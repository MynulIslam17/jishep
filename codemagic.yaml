# Jishep / GPS Ceilo – Codemagic configuration
# Tracked remote: Syed-Bipul-Rahman/jishep, branch: master
# iOS bundle ID: org.gaccchurch.gpsceilo
# Before running ios-testflight, create an App Store Connect integration
# named "jishep" and configure iOS distribution signing in Codemagic.
# ios-testflight stays manual so a push does not upload to TestFlight.

workflows:
  flutter-ci:
    name: Jishep - Flutter checks
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze Flutter code
        script: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        script: flutter test

  android-debug:
    name: Jishep - Android APK (test)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-simulator:
    name: Jishep - iOS simulator (test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: find ios -name Podfile -execdir pod install \;
      - name: Build for iOS simulator (no signing)
        script: flutter build ios --simulator

  ios-testflight:
    name: Jishep - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    # The name below must match your Codemagic App Store Connect integration.
    integrations:
      app_store_connect: jishep
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.gaccchurch.gpsceilo
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: find ios -name Podfile -execdir pod install \;
      - name: Apply iOS distribution signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
