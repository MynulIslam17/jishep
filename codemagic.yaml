# Jishep / GPS Ceilo - Codemagic configuration
# Codemagic repository: MynulIslam17/jishep (master)
# Apple Developer team: Jose Rafael Nunez
# iOS bundle ID: org.gaccchurch.gpsceilo
# Apple integration name: Jose Rafael Nunez
# Signing assets stored in Codemagic:
#   Apple Distribution certificate: gps_cielo_distribution
#   App Store provisioning profile: gps_cielo_appstore (expires 2027-10-12)
# Apple Developer Team ID: T83PP9TMXS
# Firebase project: gps-cielo (ios/Runner/GoogleService-Info.plist is committed)
# Push notifications: Release signs with ios/Runner/RunnerRelease.entitlements
#   (aps-environment; App Store export sets it to production from the profile).
#   The App Store profile must be created after Push Notifications was enabled.
# TestFlight is manual: pushing code will not upload a release.

workflows:
  flutter-ci:
    name: Jishep - Flutter checks
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze Flutter code
        script: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        script: flutter test

  android-debug:
    name: Jishep - Android APK (test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-simulator:
    name: Jishep - iOS simulator (test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install
      - name: Build for iOS simulator (no signing)
        script: flutter build ios --simulator

  ios-testflight:
    name: Jishep - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: "Jose Rafael Nunez"
    environment:
      # Same Flutter as the local machine: plugins resolve through Swift Package Manager.
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - gps_cielo_appstore
        certificates:
          - gps_cielo_distribution
      vars:
        BUNDLE_ID: org.gaccchurch.gpsceilo
        TEAM_ID: T83PP9TMXS
    scripts:
      - name: Check Firebase and entitlements
        script: |
          set -e
          plutil -lint ios/Runner/GoogleService-Info.plist ios/Runner/Info.plist ios/Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c "Print :PROJECT_ID" ios/Runner/GoogleService-Info.plist | grep -qx "gps-cielo"
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/Runner/GoogleService-Info.plist | grep -qx "$BUNDLE_ID"
          grep -q "com.apple.developer.applesignin" ios/Runner/Runner.entitlements
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install
      - name: Apply iOS distribution signing
        script: |
          set -e
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "Runner is not using $BUNDLE_ID, so the App Store profile cannot be applied."
            exit 1
          fi
          # Push notifications need a profile made after Push Notifications
          # was enabled for the App ID (it carries aps-environment).
          for PROFILE in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            security cms -D -i "$PROFILE" > /tmp/profile_check.plist
            if [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile_check.plist)" = "$TEAM_ID.$BUNDLE_ID" ]; then
              APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/profile_check.plist 2>/dev/null || true)
              NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile_check.plist)
              if [ "$APS" != "production" ]; then
                echo "Profile '$NAME' has no Push Notifications (aps-environment)."
                echo "Create a new App Store profile for $BUNDLE_ID in Apple Developer > Profiles,"
                echo "fetch it in Codemagic (Code signing identities > iOS provisioning profiles),"
                echo "and reference it under ios_signing.provisioning_profiles."
                exit 1
              fi
              echo "Profile '$NAME' includes push (aps-environment=$APS)."
            fi
          done
          xcode-project use-profiles
          if ! grep -q "<string>app-store" /Users/builder/export_options.plist; then
            echo "Export options are not App Store. Check certificate gps_cielo_distribution and profile gps_cielo_appstore."
            cat /Users/builder/export_options.plist
            exit 1
          fi
      - name: Pick next build number
        script: |
          set -e
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")' || true)
          LATEST=0
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-build-number "$APP_ID" --platform IOS 2>/dev/null || echo 0)
          fi
          LATEST=${LATEST:-0}
          NEXT=$(( LATEST > BUILD_NUMBER ? LATEST + 1 : BUILD_NUMBER + 1 ))
          echo "App Store Connect app $APP_ID, latest build $LATEST, using build $NEXT"
          echo "NEXT_BUILD_NUMBER=$NEXT" >> $CM_ENV
      - name: Build signed IPA
        script: |
          set -e
          flutter build ipa --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Verify IPA signing
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/ipa_check && mkdir /tmp/ipa_check && unzip -q "$IPA" -d /tmp/ipa_check
          APP=$(ls -d /tmp/ipa_check/Payload/*.app)
          security cms -D -i "$APP/embedded.mobileprovision" > /tmp/ipa_check/profile.plist
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/ipa_check/profile.plist)"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /tmp/ipa_check/profile.plist >/dev/null 2>&1; then
            echo "IPA is signed with a development/ad-hoc profile, not App Store."; exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/ipa_check/profile.plist | grep -qx "$TEAM_ID"
          codesign -d --entitlements - --xml "$APP" > /tmp/ipa_check/ent.plist 2>/dev/null
          grep -q "com.apple.developer.applesignin" /tmp/ipa_check/ent.plist || { echo "Apple Sign-In entitlement missing"; exit 1; }
          grep -A1 "get-task-allow" /tmp/ipa_check/ent.plist | grep -q "<false/>" || { echo "get-task-allow is not false"; exit 1; }
          grep -A1 "aps-environment" /tmp/ipa_check/ent.plist | grep -q "<string>production</string>" || { echo "Push entitlement missing or not production"; exit 1; }
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The build appears in TestFlight for internal testers after processing.
        # External beta review needs Beta App Information filled in App Store Connect first.
        submit_to_testflight: false
